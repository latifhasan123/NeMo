services:
  # ---------------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU MYSQL 8.0
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: nemo-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nemo
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nemo-network

  # ---------------------------------------------------------------------------
  # 2. SPRING BOOT BACKEND (Java 17 - Port 8080)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend-springboot/proxy-backend
      dockerfile: Dockerfile
    container_name: nemo-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nemo?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: nemo-guardrails-secret-key-atbm-sgu-2026-very-secure-key
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: "Admin@123456"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nemo-network

  # ---------------------------------------------------------------------------
  # 3. AI PROXY FIREWALL (Python FastAPI + NeMo Guardrails - Port 8000)
  # ---------------------------------------------------------------------------
  proxy-python:
    build:
      context: ./proxy-python
      dockerfile: Dockerfile
    container_name: nemo-proxy-python
    restart: always
    ports:
      - "8000:8000"
    environment:
      BACKEND_BASE_URL: http://backend:8080
    env_file:
      - path: ./proxy-python/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      - backend
    networks:
      - nemo-network

  # ---------------------------------------------------------------------------
  # 4. GIAO DIỆN NGƯỜI DÙNG (React 19 + Nginx - Port 5173)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: nemo-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
      - proxy-python
    networks:
      - nemo-network

volumes:
  mysql_data:
    driver: local

networks:
  nemo-network:
    driver: bridge

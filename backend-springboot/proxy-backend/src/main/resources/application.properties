# CẤU HÌNH KẾT NỐI DATABASE (Chú ý: tên database là nemo viết thường)
spring.datasource.url=jdbc:mysql://localhost:3306/nemo?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456

# CẤU HÌNH HIBERNATE (Tự động cập nhật cấu trúc bảng)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CẤU HÌNH PORT CHO BACKEND
server.port=8080

# CẤU HÌNH BẢO MẬT JWT & TÀI KHOẢN ADMIN MẶC ĐỊNH (SEEDING)
app.jwt.secret=${APP_JWT_SECRET:nemo-guardrails-secret-key-atbm-sgu-2026-very-secure-key}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}